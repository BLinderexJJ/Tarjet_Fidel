name: Flutter Web

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # La app compila sin credenciales reales: muestra la pantalla de
      # configuración. Así el CI valida analyze, tests y build sin secretos.
      - name: Crear credenciales de ejemplo
        run: cp firebase.web.example.json firebase.web.json

      - name: Dependencias
        run: flutter pub get

      - name: Analizar
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Compilar web
        run: >
          flutter build web --release --no-wasm-dry-run
          --dart-define-from-file=firebase.web.json

      - name: Guardar build web
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 7
